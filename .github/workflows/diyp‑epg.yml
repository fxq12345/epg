name: DIYP-EPG自动更新
on:
  schedule:
    # UTC 22:00 = 北京时间06:00，和旧脚本04:50错开
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 设置北京时间
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: 生成DIYP EPG
        run: python epg_to_diyp.py
      - name: 提交文件
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output_diyp/diyp_epg.txt
          git commit -m "DIYP-EPG $(date +%F)" || echo "no changes"
          git push
